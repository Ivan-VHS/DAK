name: Supabase local contract

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  database-contract:
    name: Local migrations and RLS regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.4.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Apply migrations and run pgTAP security tests
        run: supabase test db
