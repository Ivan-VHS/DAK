name: Reaper contract tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DuckOS and pinned specialist projects
        uses: actions/checkout@v4
        with:
          path: DuckOS
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every Reaper source file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper" python -m reaper --check "$source"
          done < <(find "$GITHUB_WORKSPACE/DuckOS/duckos" -type f -name '*.rpr' -print0)

      - name: Execute RFS-01 Duck OS adapter smoke contract
        run: PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper" python -m reaper "$GITHUB_WORKSPACE/DuckOS/rfs01-duckos-smoke.rpr"

      - name: Execute DABI64, capability and bounded IPC contracts
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper"
          python -m reaper "$GITHUB_WORKSPACE/DuckOS/duckos/kernel/dabi64.rpr"
          python -m reaper "$GITHUB_WORKSPACE/DuckOS/duckos/security/capability_broker.rpr"
          python -m reaper "$GITHUB_WORKSPACE/DuckOS/duckos/services/ipc_contract.rpr"
      - name: Run system contract suite with tree-walk engine
        run: PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper" python -m reaper "$GITHUB_WORKSPACE/DuckOS/contract_tests.rpr"

      - name: Run core MVP contract suite with tree-walk engine
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper" python -m reaper --check "$GITHUB_WORKSPACE/DuckOS/core_mvp_tests.rpr"
          PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper" python -m reaper "$GITHUB_WORKSPACE/DuckOS/core_mvp_tests.rpr"

      - name: Run early-math pack invariants with Reaper
        run: PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper" python -m reaper "$GITHUB_WORKSPACE/DuckOS/duckos/education/early_math_contract.rpr"

      - name: Run system contract suite with VM engine
        run: PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper" python -m reaper --engine vm "$GITHUB_WORKSPACE/DuckOS/contract_tests.rpr"

      - name: Run core MVP contract suite with VM engine
        run: PYTHONPATH="$GITHUB_WORKSPACE/DuckOS/projects/reaper" python -m reaper --engine vm "$GITHUB_WORKSPACE/DuckOS/core_mvp_tests.rpr"
