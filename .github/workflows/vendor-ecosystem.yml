name: Vendor ecosystem source trees

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/vendor-ecosystem.yml"
      - "scripts/vendor-ecosystem.sh"
      - "federation/repositories.v1.json"
      - "federation/vendor-sources.v1.json"

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: duckos-vendor-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  import-source-trees:
    name: Import exact upstream trees into the monorepo
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the PR source branch without submodules
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: false

      - name: Configure the import identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree --version

      - name: Vendor all pinned upstream source trees
        run: bash scripts/vendor-ecosystem.sh --import

      - name: Push the monorepo conversion to the PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$HEAD_REF"
          git push origin "HEAD:refs/heads/$HEAD_REF"

      - name: Start full ecosystem release validation on the vendored commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh workflow run release-iso.yml --ref "$HEAD_REF"
