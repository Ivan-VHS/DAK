name: DuckOS ABI contract
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure DABI64 contract tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build ABI library and tests
        run: cmake --build build --parallel
      - name: Validate frame and result contract
        run: ctest --test-dir build --output-on-failure
