name: Mora workspace

on:
  push:
    branches: [main, "mora/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile host and tests
        run: python -m compileall -q mora_host.py tests
      - name: Run local host tests
        run: python -m unittest discover -s tests -v
