name: Repository federation

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'projects/**'
      - 'federation/**'
      - 'schemas/repository-federation.v1.schema.json'
      - 'tools/federate_repositories.py'
      - 'tests/test_repository_federation.py'
      - '.github/workflows/repository-federation.yml'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'projects/**'
      - 'federation/**'
      - 'schemas/repository-federation.v1.schema.json'
      - 'tools/federate_repositories.py'
      - 'tests/test_repository_federation.py'
      - '.github/workflows/repository-federation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-sources:
    name: Validate pinned project sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate vendored source trees and provenance
        run: bash scripts/vendor-ecosystem.sh --verify
      - name: Test monorepo source boundaries
        run: node --test tests/mora-vendored-sources.test.mjs
