name: Mora browser tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DuckOS
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Mora contract tests
        run: npm test
