name: DuckOS CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and federation
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckOS tools
        run: python -m pip install -e ./tools
      - name: Compile Python sources
        run: python -m compileall -q tools/src tools/tests native/services/duckos_services native/services/tests
      - name: Run tests
        run: python -m unittest discover -s tools/tests -v
      - name: Test native user-space services
        run: make -C native services-test
      - name: Validate JSON manifests
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check desktop/app.js && node --check desktop/newsroom/newsroom.js
