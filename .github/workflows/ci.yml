name: DuckOS build tooling

on:
  push:
    branches: [main, "feat/**", "refactor/**"]
    paths: ["duckos/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["duckos/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q duckos tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: python -m duckos --help
