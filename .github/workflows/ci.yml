name: DuckOS Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-contract:
    name: Host-side boot contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure with sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDUCKOS_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run contract tests
        run: ctest --test-dir build --output-on-failure
