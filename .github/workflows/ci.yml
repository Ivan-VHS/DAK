name: DuckOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-3-10:
    name: Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip jsonschema pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py
      - run: python tools/validate_engineering_evolution.py

  python-3-11:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip jsonschema pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py
      - run: python tools/validate_engineering_evolution.py

  python-3-12:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip jsonschema pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py
      - run: python tools/validate_engineering_evolution.py

  mora-node:
    name: Mora shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  native-c:
    name: Native C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native targets when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel
          elif find src include -type f -name '*.c' -print -quit 2>/dev/null | grep -q . || find src include -type f -name '*.cc' -print -quit 2>/dev/null | grep -q . || find src include -type f -name '*.cpp' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Native source exists but no CMakeLists.txt build contract is defined."
            exit 1
          else
            echo "::notice::No native C/C++ source tree or build target exists in this DuckOS repository revision; native compilation is not applicable yet."
          fi

  beelzebub-java-17:
    name: Beelzebub AV Java 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and self-test Beelzebub AV
        run: |
          chmod +x apps/beelzebub-av/build.sh apps/beelzebub-av/test.sh
          apps/beelzebub-av/test.sh

  beelzebub-av-go-bridge:
    name: Beelzebub AV Go event bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: apps/beelzebub-av/bridge/go.mod
      - name: Test and vet the local event bridge
        working-directory: apps/beelzebub-av/bridge
        env:
          GOTOOLCHAIN: local
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./cmd/bav-bridge

  beelzebub-upstream-bav-patch:
    name: Beelzebub v3 upstream patch compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      - name: Checkout pinned upstream source
        run: |
          git clone --filter=blob:none https://github.com/beelzebub-labs/beelzebub.git /tmp/beelzebub-upstream
          git -C /tmp/beelzebub-upstream checkout 3f20be5355c7d6f144329e39c478cdd7ff98184c
      - name: Apply and test the BAV event-forwarder patch
        run: |
          PATCH="$GITHUB_WORKSPACE/apps/beelzebub-av/upstream/beelzebub-v3/0001-bav-event-forwarder.patch"
          git -C /tmp/beelzebub-upstream apply --check "$PATCH"
          git -C /tmp/beelzebub-upstream apply "$PATCH"
          cd /tmp/beelzebub-upstream
          gofmt -w internal/parser/configurations_parser.go internal/builder/builder.go internal/builder/director.go internal/builder/bav_event_forwarder.go internal/builder/bav_event_forwarder_test.go
          go test ./internal/parser ./internal/builder
