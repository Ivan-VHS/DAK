name: DuckOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-3-10:
    name: Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip jsonschema
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py

  python-3-11:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip jsonschema
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py

  python-3-12:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip jsonschema
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py

  mora-node:
    name: Mora shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Check Mora shell modules
        run: node --check mora/app.js && node --check mora/shell.js

  native-c:
    name: Native C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 development and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcomposite-dev libxdamage-dev libxrender-dev libxfixes-dev libxext-dev xvfb
      - name: Build native compositor
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Verify X11 extension negotiation on a virtual display
        run: xvfb-run -a ./build/duckos-compositor --check
          xvfb-run -a ./build/duckos-compositor --self-test
