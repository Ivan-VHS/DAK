name: DuckOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duckos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-3-10:
    name: Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip jsonschema pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py
      - run: python tools/validate_engineering_evolution.py

  python-3-11:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip jsonschema pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py
      - run: python tools/validate_engineering_evolution.py

  python-3-12:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip jsonschema pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_app_catalog.py
      - run: python tools/validate_engineering_evolution.py

  mora-node:
    name: Mora shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: npm test

  native-c:
    name: Native C
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build native targets when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel
          elif find src include -type f -name '*.c' -print -quit 2>/dev/null | grep -q . || find src include -type f -name '*.cc' -print -quit 2>/dev/null | grep -q . || find src include -type f -name '*.cpp' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Native source exists but no CMakeLists.txt build contract is defined."
            exit 1
          else
            echo "::notice::No native C/C++ source tree or build target exists in this DuckOS repository revision; native compilation is not applicable yet."
          fi
