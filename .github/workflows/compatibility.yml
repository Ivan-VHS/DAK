name: DuckOS compatibility checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/duckos-windows-compatibility"]

permissions:
  contents: read

jobs:
  python:
    name: Python runtime and CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and package dependencies
        run: python -m pip install --upgrade pip setuptools jsonschema && python -m pip install -e .
      - name: Run Python test suite
        run: python -m unittest discover -s tests -v
      - name: Compile backend modules
        run: python -m compileall -q duckos
      - name: Smoke-test compatibility CLI
        run: python -m duckos.cli compatibility status && python -m duckos.cli compatibility prefixes

  mora:
    name: Mora browser and syntax contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser contract tests
        run: npm test
      - name: Check application module syntax
        run: node --check mora/app.js && node --check mora/compatibility.js
