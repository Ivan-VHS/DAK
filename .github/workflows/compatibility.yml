name: DuckOS compatibility checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/duckos-windows-compatibility"]

permissions:
  contents: read

jobs:
  python:
    name: Python contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckOS build tools
        run: python -m pip install --upgrade pip setuptools && python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q duckos
      - name: Check compatibility CLI
        run: |
          duckos compatibility status
          duckos compatibility prefixes

  mora:
    name: Mora browser contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run browser contract tests
        run: npm test
