name: DuckOS ecosystem release ISO

on:
  pull_request:
    paths:
      - "boot/**"
      - "kernel/**"
      - "foundation/**"
      - "mora/**"
      - "federation/**"
      - "projects/**"
      - "scripts/run-mora.*"
      - "tools/test_mora_browser.mjs"
      - "docs/RELEASE_EDITION.md"
      - "README.md"
      - "CMakeLists.txt"
      - ".github/workflows/release-iso.yml"
  push:
    branches: [main]
    paths:
      - "boot/**"
      - "kernel/**"
      - "foundation/**"
      - "mora/**"
      - "federation/**"
      - "projects/**"
      - "scripts/run-mora.*"
      - "tools/test_mora_browser.mjs"
      - "docs/RELEASE_EDITION.md"
      - "README.md"
      - "CMakeLists.txt"
      - ".github/workflows/release-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duckos-ecosystem-release-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, test and boot the ecosystem release
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact pinned repositories
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install native toolchains and QEMU firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build binutils curl tar xorriso \
            qemu-system-x86 ovmf qt6-base-dev python3 python3-tk

      - name: Show toolchain versions
        run: |
          gcc --version
          cmake --version
          python3 --version
          node --version
          xorriso -version

      - name: Validate pinned repository graph
        run: |
          python3 tools/federate_repositories.py validate --json
          python3 tools/federate_repositories.py status --json

      - name: Test Mora shell contracts
        run: npm test

      - name: Build native projects, run tests and package the ISO
        run: |
          bash boot/build-release-iso.sh \
            --work-dir build/release \
            --output build/DuckOS-Release-x86_64.iso

      - name: Locate OVMF firmware
        run: |
          if [[ -f /usr/share/OVMF/OVMF_CODE.fd && -f /usr/share/OVMF/OVMF_VARS.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars=/usr/share/OVMF/OVMF_VARS.fd
          elif [[ -f /usr/share/OVMF/OVMF_CODE_4M.fd && -f /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            echo "No matching OVMF CODE/VARS firmware pair was found" >&2
            find /usr/share -iname '*OVMF*' -type f -print
            exit 1
          fi
          echo "OVMF_CODE_PATH=$code" >> "$GITHUB_ENV"
          echo "OVMF_VARS_PATH=$vars" >> "$GITHUB_ENV"

      - name: Verify release ISO in BIOS and UEFI
        run: |
          bash boot/test-qemu.sh \
            --iso build/DuckOS-Release-x86_64.iso \
            --output-dir build/release/qemu \
            --ovmf-code "$OVMF_CODE_PATH" \
            --ovmf-vars "$OVMF_VARS_PATH"

      - name: Browser-test Mora and the four workbench launchers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory build/release/payload/duckos > build/release/mora-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/mora/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/mora/app.js | grep -q "federatedProjectPanel"
          curl --fail --silent http://127.0.0.1:8765/federation/mora-workbenches.v1.json | grep -q "ventusample-workbench"
          node tools/test_mora_browser.mjs

      - name: Publish release ISO, checksums and boot evidence
        uses: actions/upload-artifact@v4
        with:
          name: DuckOS-Ecosystem-Release-x86_64
          path: |
            build/DuckOS-Release-x86_64.iso
            build/DuckOS-Release-x86_64.iso.sha256
            build/release/payload/duckos/SHA256SUMS
            build/release/payload/duckos/release/BUILD-INFO.txt
            build/release/qemu/*.log
            build/release/mora-http.log
          if-no-files-found: error
          retention-days: 90
