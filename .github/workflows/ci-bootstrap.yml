name: Dak bootstrap validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Materialize source for validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dakos"
          if [[ -f artifacts/source-bundle/part00 ]]; then
            cat artifacts/source-bundle/part0[0-4] | base64 --decode > "$RUNNER_TEMP/dakos-source.tar.xz"
            echo "5e2368c939097f6e01e15547a0ebce7b803615ccd257fc4c216389d8e314aaa7  $RUNNER_TEMP/dakos-source.tar.xz" | sha256sum --check
            tar -xJf "$RUNNER_TEMP/dakos-source.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/dakos"
          else
            git archive HEAD | tar -x -C "$RUNNER_TEMP/dakos"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dakos-source
          path: ${{ runner.temp }}/dakos
          if-no-files-found: error

  kernel:
    needs: prepare-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dakos-source
          path: dakos
      - name: Build freestanding kernel
        working-directory: dakos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils
          make clean kernel
          file build/dakos.elf
          readelf -h build/dakos.elf

  initramfs:
    needs: prepare-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dakos-source
          path: dakos
      - name: Validate initramfs reader
        working-directory: dakos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
          make initramfs
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_initramfs_parser.c kernel/boot/initramfs.c -o /tmp/test-initramfs
          /tmp/test-initramfs build/initramfs.cpio

  tooling:
    needs: prepare-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dakos-source
          path: dakos
      - name: Test package manager, archive builder and driver ABI
        working-directory: dakos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -v
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_driver_abi.c kernel/drivers/registry.c -o /tmp/test-driver-abi
          /tmp/test-driver-abi
          bash -n tools/build-iso.sh tools/dak-agent-sandbox desktop/start-dak-session

  boot-image:
    needs: prepare-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dakos-source
          path: dakos
      - name: Build ISO and smoke-test the BIOS path
        working-directory: dakos
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential python3 curl xorriso qemu-system-x86

          # The verified source bundle may not preserve the helper's executable bit.
          chmod +x tools/build-iso.sh

          make clean all test

          iso_log="$RUNNER_TEMP/dakos-iso-build.log"
          if make iso >"$iso_log" 2>&1; then
            cat "$iso_log"
          else
            iso_status=$?
            if ! grep -Fq "Limine installer binary not found" "$iso_log"; then
              cat "$iso_log"
              exit "$iso_status"
            fi

            # Limine's binary release ships the Unix host tool as source.
            # Build it from the already downloaded and checksum-verified package.
            limine_source="$(find .limine -type f -name limine.c -print -quit)"
            if [[ -z "$limine_source" ]]; then
              cat "$iso_log"
              echo "Limine host-tool source was not present in the verified package." >&2
              exit "$iso_status"
            fi

            limine_dir="$(dirname "$limine_source")"
            echo "Building Limine's host installer from the verified local source package."
            make -C "$limine_dir"

            limine_tool="$limine_dir/limine"
            if [[ ! -x "$limine_tool" ]]; then
              limine_tool="$(find "$limine_dir" -maxdepth 2 -type f -name limine -perm -u+x -print -quit)"
            fi
            if [[ -z "$limine_tool" || ! -x "$limine_tool" ]]; then
              echo "Limine host-tool build completed without producing an executable." >&2
              exit 1
            fi

            export LIMINE_TOOL="$limine_tool"
            export PATH="$(dirname "$limine_tool"):$PATH"
            make iso
          fi

          set +e
          timeout 18s qemu-system-x86_64 \
            -machine q35 -m 512M -cdrom build/dakos.iso -boot d \
            -display none -monitor none -serial file:build/qemu-serial.log \
            -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            cat build/qemu-serial.log || true
            exit "$status"
          fi
          cat build/qemu-serial.log
          grep -F "Dak kernel: early boot" build/qemu-serial.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dakos-x86_64-iso
          path: dakos/build/dakos.iso
          if-no-files-found: error
