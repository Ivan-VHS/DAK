name: Mora gaming integration

on:
  pull_request:
    paths:
      - "mora/**"
      - "dakos/gaming/**"
      - "dakos/cli.py"
      - "catalogs/game-performance-rules.v1.json"
      - "tests/test_gaming_policy.py"
      - "tests/test_gaming_detection.py"
      - "docs/GAMING_POLICY_66.md"
      - "docs/GAMING_PROCESS_DETECTION.md"
      - "docs/GAMING_FEDERATION_CONTRACT.md"
      - "examples/game-profiles.example.json"
      - "docs/GAMING_PERFORMANCE_INTEGRATION.md"
      - "scripts/validate_mora_gaming.py"
      - ".github/workflows/mora-gaming.yml"
  push:
    branches:
      - main
    paths:
      - "mora/**"
      - "dakos/gaming/**"
      - "dakos/cli.py"
      - "catalogs/game-performance-rules.v1.json"
      - "tests/test_gaming_policy.py"
      - "docs/GAMING_POLICY_66.md"
      - "docs/GAMING_PERFORMANCE_INTEGRATION.md"
      - "scripts/validate_mora_gaming.py"
      - ".github/workflows/mora-gaming.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Mora JavaScript syntax
        run: node --check mora/app.js
      - name: Parse the IPC schema
        run: python -m json.tool mora/contracts/oplague-gaming.v1.schema.json > /dev/null
      - name: Validate the gaming capability contract
        run: python scripts/validate_mora_gaming.py
      - name: Test the 66-rule gaming policy
        run: python -m unittest tests.test_gaming_policy -v
      - name: Test read-only game process detection
        run: python -m unittest tests.test_gaming_detection -v
      - name: Smoke-test read-only game-process discovery
        run: python -m dakos gaming-detect --profiles examples/game-profiles.example.json
      - name: Smoke-test the gaming assessment CLI
        run: python -m dakos gaming-assess
      - name: Smoke-test the gaming lifecycle CLI
        run: python -m dakos gaming-transition idle game_detected --profile-id smoke-test --process-identity smoke.exe
