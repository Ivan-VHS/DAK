<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#292653">
<title>Mora OS — рабочий стол и приложения</title>
<style>
:root{color-scheme:dark;--glass:rgba(255,255,255,.14);--glass-hi:rgba(19,22,49,.88);--line:rgba(255,255,255,.25);--txt:#fff;--muted:rgba(255,255,255,.72);--shadow:0 24px 70px rgba(5,6,35,.42);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;color:var(--txt);background:#24234f;user-select:none}
button,input,select,textarea{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:3px}
#wall{position:fixed;inset:0;width:100%;height:100%;z-index:-1}.screen{height:100%;min-height:580px;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) clamp(14px,3vw,38px) calc(14px + env(safe-area-inset-bottom));gap:10px}
.bar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:.88rem}.bar-left,.bar-right{display:flex;align-items:center;gap:15px}.logo{font-weight:800;letter-spacing:.17em;text-transform:lowercase;font-size:1.05rem}.status{padding:5px 10px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.1);font-size:.76rem;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(190px,1fr) minmax(320px,540px) minmax(220px,1fr);gap:clamp(12px,2.6vw,36px);align-items:center;min-height:0}.clock{align-self:center}.clock-time{font-size:clamp(3.2rem,8vw,6.2rem);line-height:1;font-weight:250;letter-spacing:-.055em;text-shadow:0 4px 28px rgba(20,20,70,.35)}.clock-date{margin-top:9px;color:var(--muted);font-size:1rem;text-transform:capitalize}.clock-hint{margin-top:18px;color:rgba(255,255,255,.54);font-size:.78rem;max-width:250px;line-height:1.5}
.app-grid{display:grid;grid-template-columns:repeat(4,minmax(66px,1fr));gap:clamp(14px,2.4vw,26px) 12px;justify-items:center}.app{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;width:82px;padding:5px 3px;border-radius:18px;text-align:center;font-size:.83rem;font-weight:600}.app:hover .ico{transform:translateY(-4px) scale(1.06)}.app:active .ico{transform:scale(.94)}.ico{width:64px;height:64px;border-radius:21px;display:grid;place-items:center;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:inset 0 1px 1px #ffffff88,inset 0 -6px 12px #0003,0 10px 22px #080a3b66;transition:transform .18s}.ico svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px #0004)}.app-name{text-shadow:0 2px 8px #090a32aa}
.widgets{display:grid;gap:13px}.widget{border:1px solid var(--line);border-radius:23px;padding:15px 17px;text-align:left;background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 12px 30px #080a3b33;cursor:pointer}.widget h3{margin:0 0 7px;color:var(--muted);font-size:.8rem;font-weight:600}.widget-value{font-size:1.55rem;font-weight:650;letter-spacing:-.035em}.widget-sub{font-size:.78rem;color:var(--muted);margin-top:3px}.meter{height:7px;background:#fff2;border-radius:8px;overflow:hidden;margin-top:11px}.meter>i{display:block;height:100%;background:linear-gradient(90deg,#ffd470,#ff9ab6);border-radius:8px}.device-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.device-chips span{padding:5px 8px;border-radius:10px;background:#fff2;font-size:.72rem}
.dock-wrap{display:flex;justify-content:center}.dock{display:flex;gap:13px;padding:9px 16px;border-radius:28px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 14px 34px #080a3b44}.dock .app{width:auto;padding:1px}.dock .ico{width:54px;height:54px;border-radius:17px}.dock .app-name{display:none}.dock .app.run:after{content:"";width:5px;height:5px;background:#fff;border-radius:50%;margin-top:-2px}
#win{position:fixed;left:50%;top:50%;width:min(790px,94vw);height:min(760px,84vh);display:none;flex-direction:column;border:1px solid var(--line);border-radius:25px;overflow:hidden;background:var(--glass-hi);backdrop-filter:blur(30px) saturate(1.35);box-shadow:var(--shadow);transform:translate(-50%,-50%);z-index:10}#win.open{display:flex;animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-47%) scale(.97)}}.window-head{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none}.window-head .ico{width:31px;height:31px;border-radius:10px}.window-head .ico svg{width:18px;height:18px}.window-title{flex:1;font-weight:750}.window-title small{display:block;font-size:.72rem;font-weight:400;color:var(--muted)}.window-close{border:0;border-radius:50%;width:31px;height:31px;background:#fff2;font-size:1.2rem;cursor:pointer}.window-body{padding:18px;overflow:auto;user-select:text;min-height:0}.section-title{margin:17px 0 7px;color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.section-title:first-child{margin-top:0}.note{padding:11px 13px;border:1px solid #ffffff20;border-radius:14px;background:#ffffff0c;color:var(--muted);font-size:.8rem;line-height:1.48;margin:8px 0 13px}.note.warn{border-color:#ffc66a55;background:#ffbf4310;color:#ffe2ae}.note.good{border-color:#8de5b955;background:#54c99012;color:#bff4d5}.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panel{border:1px solid #ffffff20;border-radius:16px;padding:13px;background:#ffffff0b;min-width:0}.panel h4{margin:0 0 8px;font-size:.92rem}.muted{color:var(--muted);font-size:.8rem;line-height:1.45}.small{font-size:.74rem;color:var(--muted)}.field{display:grid;gap:5px;margin:8px 0}.field label{font-size:.77rem;color:var(--muted)}.field input,.field select,.field textarea,.input{width:100%;min-width:0;border:1px solid #ffffff2b;border-radius:11px;padding:10px 12px;background:#ffffff12;color:#fff;outline:none}.field option{background:#252345}.field textarea{min-height:82px;resize:vertical}.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:1px solid #ffffff28;border-radius:12px;padding:9px 13px;background:#ffffff18;cursor:pointer;font-size:.82rem;font-weight:650}.btn:hover{background:#ffffff2b}.btn.primary{background:#775ee9;border-color:#9b8bff}.btn.danger{background:#ad3a62aa}.btn:disabled{opacity:.45;cursor:not-allowed}.list{display:grid;gap:8px}.list-row{display:flex;gap:10px;align-items:center;padding:10px 11px;border:1px solid #ffffff1c;border-radius:13px;background:#ffffff08;min-width:0}.list-main{flex:1;min-width:0}.list-main strong{display:block;overflow-wrap:anywhere;font-size:.86rem}.list-main small{display:block;color:var(--muted);font-size:.74rem;margin-top:3px;line-height:1.4}.list-row input[type=range]{max-width:120px;accent-color:#ffd470}.empty{padding:20px;text-align:center;color:var(--muted);font-size:.83rem;border:1px dashed #ffffff35;border-radius:15px}.switch{width:44px;height:25px;appearance:none;background:#fff3;border-radius:20px;position:relative;cursor:pointer;margin:0}.switch:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .15s}.switch:checked{background:#755be7}.switch:checked:before{transform:translateX(19px)}.bar-list{display:grid;gap:9px}.bar-line{display:grid;grid-template-columns:100px 1fr auto;gap:9px;align-items:center;font-size:.78rem}.bar-track{height:9px;background:#fff2;border-radius:8px;overflow:hidden}.bar-track i{display:block;height:100%;background:linear-gradient(90deg,#ffd36d,#ff8faf)}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:9px}.media-card{border:1px solid #ffffff20;border-radius:13px;overflow:hidden;background:#ffffff09}.media-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.media-card .media-caption{padding:8px;font-size:.73rem;line-height:1.4}.tab-row{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid #ffffff20;border-radius:12px;margin:7px 0}.tab-row .list-main{flex:1}.badge{font-size:.68rem;color:#d8d4ff;background:#8876ed44;border:1px solid #b2a7ff33;border-radius:20px;padding:3px 7px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:10px 15px;border:1px solid var(--line);border-radius:14px;background:#171832ee;box-shadow:var(--shadow);z-index:30;font-size:.82rem;max-width:min(92vw,520px);text-align:center}.reader{background:#f6f0e4;color:#272421;border-radius:14px;padding:20px;line-height:1.65}.reader h2{margin-top:0}.reader p{white-space:pre-wrap}
@media(max-width:980px){.main{grid-template-columns:1fr;align-content:start;overflow:auto;padding:12px 0;gap:17px}.clock{display:flex;align-items:baseline;gap:13px}.clock-time{font-size:3.2rem}.clock-date{margin:0}.clock-hint{display:none}.app-grid{max-width:540px;width:100%;margin:auto}.widgets{grid-template-columns:repeat(2,minmax(0,1fr))}.screen{grid-template-rows:auto 1fr auto}}
@media(max-width:560px){.screen{padding-left:12px;padding-right:12px}.bar{font-size:.75rem}.main{gap:14px}.app-grid{grid-template-columns:repeat(4,minmax(55px,1fr));gap:11px 3px}.app{width:70px;font-size:.73rem}.app .ico{width:55px;height:55px;border-radius:17px}.widgets{grid-template-columns:1fr 1fr}.widget{padding:11px}.widget-value{font-size:1.2rem}.dock{gap:7px;padding:7px}.dock .ico{width:45px;height:45px}.form-row,.card-grid{grid-template-columns:1fr}.window-body{padding:13px}#win{width:96vw;height:88vh;max-height:88vh}.bar-right .status{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<svg id="wall" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b1f4a"/><stop offset=".45" stop-color="#5a4aa8"/><stop offset=".72" stop-color="#e58aa8"/><stop offset="1" stop-color="#ffd7a1"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff6d6"/><stop offset=".5" stop-color="#ffd8a0" stop-opacity=".7"/><stop offset="1" stop-color="#ffb4b4" stop-opacity="0"/></radialGradient><linearGradient id="h1" x2="0" y2="1"><stop stop-color="#7c5fb8"/><stop offset="1" stop-color="#b57ab8"/></linearGradient><linearGradient id="h2" x2="0" y2="1"><stop stop-color="#4b3f94"/><stop offset="1" stop-color="#6d59a8"/></linearGradient><linearGradient id="h3" x2="0" y2="1"><stop stop-color="#2f2e7a"/><stop offset="1" stop-color="#3e3a8c"/></linearGradient><linearGradient id="h4" x2="0" y2="1"><stop stop-color="#1c2257"/><stop offset="1" stop-color="#232a66"/></linearGradient></defs><rect width="1600" height="900" fill="url(#sky)"/><circle cx="1130" cy="560" r="260" fill="url(#sun)"/><circle cx="1130" cy="560" r="62" fill="#fff3d0"/><path d="M0 640 Q250 520 520 610 T1050 590 T1600 560 V900 H0Z" fill="url(#h1)" opacity=".9"/><path d="M0 700 Q300 600 600 690 T1180 660 T1600 650 V900 H0Z" fill="url(#h2)"/><path d="M0 770 Q280 700 640 765 T1240 740 T1600 750 V900 H0Z" fill="url(#h3)"/><path d="M0 835 Q360 790 760 830 T1600 820 V900 H0Z" fill="url(#h4)"/><g fill="#fff" opacity=".7"><circle cx="160" cy="90" r="1.6"/><circle cx="420" cy="170" r="1.2"/><circle cx="720" cy="70" r="1.8"/><circle cx="980" cy="130" r="1.3"/><circle cx="1320" cy="60" r="1.6"/><circle cx="1500" cy="190" r="1.2"/><circle cx="260" cy="260" r="1.1"/></g></svg>
<div class="screen"><header class="bar"><div class="bar-left"><span class="logo">mora</span><span id="current-label">Домашний экран</span></div><div class="bar-right"><span class="status">Локальный режим · прототип</span><span id="clock-mini"></span></div></header>
<main class="main"><section class="clock"><div><div class="clock-time" id="clock-time">--:--</div><div class="clock-date" id="clock-date"></div><div class="clock-hint">Ваше пространство. Приложения работают с данными, которые вы добавляете в этом браузере.</div></div></section><section class="app-grid" id="app-grid" aria-label="Приложения"></section>
<section class="widgets"><button class="widget" data-open="kabon"><h3>Ka-bon · расходы сегодня</h3><div class="widget-value" id="today-total">0 ₴</div><div class="widget-sub" id="today-sub">Пока нет добавленных расходов</div><div class="meter"><i id="today-meter" style="width:0%"></i></div></button><button class="widget" data-open="unify"><h3>Unify · устройства</h3><div class="widget-value" id="device-count">0</div><div class="widget-sub" id="device-sub">Нет локально сохранённых устройств</div><div class="device-chips" id="device-chips"><span>Связь настраивается</span></div></button></section></main>
<footer class="dock-wrap"><nav class="dock" id="dock" aria-label="Избранные приложения"></nav></footer></div>
<section id="win" role="dialog" aria-modal="false" aria-labelledby="window-title"><div class="window-head" id="window-head"><span id="window-icon"></span><div class="window-title" id="window-title">App</div><button class="window-close" id="window-close" aria-label="Закрыть">×</button></div><div class="window-body" id="window-body"></div></section>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
const APPS=[
{id:'cockos',name:'Cockos',sub:'Звук и запись',c1:'#ff6fa3',c2:'#c2335f',glyph:'<path d="M5 14v6M10 8v18M15 4v26M20 10v14M25 13v8M30 16v2"/>'},
{id:'kavun',name:'Kavun',sub:'Фото и воспоминания',c1:'#6fe39d',c2:'#1f9d63',glyph:'<path d="M4 14a14 14 0 0 0 28 0zM8 14a10 10 0 0 0 20 0M13 19v.1M18 22v.1M23 19v.1"/>'},
{id:'kabon',name:'Ka-bon',sub:'Деньги и чеки',c1:'#ffd45c',c2:'#e39a1a',glyph:'<circle cx="18" cy="18" r="13"/><path d="M22 12h-6a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6h-6M18 9v3M18 24v3"/>'},
{id:'gloverty',name:'Gloverty',sub:'Автоматизация и жесты',c1:'#9a7dff',c2:'#5a36d6',glyph:'<path d="M20 4 8 20h9l-2 12 13-17h-9z"/>'},
{id:'po',name:'Po',sub:'Браузер',c1:'#5fb2ff',c2:'#2058d8',glyph:'<circle cx="18" cy="18" r="13"/><path d="m23 13-3 7-7 3 3-7z"/>'},
{id:'illidia',name:'Illidia',sub:'Игры',c1:'#4fe0e0',c2:'#1590a8',glyph:'<path d="M9 12h18a6 6 0 0 1 6 6l-1 7a3.5 3.5 0 0 1-6 1.5L24 24H12l-2 2.5A3.5 3.5 0 0 1 4 25l-1-7a6 6 0 0 1 6-6z"/><path d="M11 16v4M9 18h4M23 17v.1M26 19v.1"/>'},
{id:'unify',name:'Unify',sub:'Связь устройств',c1:'#e8edff',c2:'#9aa8e6',glyph:'<circle cx="12" cy="18" r="8"/><circle cx="24" cy="18" r="8"/>'}
];
const KEY='mora.local-suite.v1';
const emptyState=()=>({dailyLimit:0,expenses:[],subscriptions:[],familyMembers:[],media:[],slices:[],audioTracks:[],volumePrefs:{},rules:[],tabs:[],readerText:'',games:[],clips:[],devices:[],clipboardText:'',doNotDisturb:false,trackerProtection:true,retouch:{mediaId:'',brightness:100,contrast:100,saturate:100},theme:'sunset',reduceMotion:false});
let state=loadState();let currentApp=null;let toastTimer=null;let dbPromise=null;let activeRecording=null;let activeScreenCapture=null;let objectUrls=new Map();
function loadState(){try{const raw=localStorage.getItem(KEY);return raw?{...emptyState(),...JSON.parse(raw)}:emptyState()}catch{return emptyState()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));renderWidgets()}catch(e){notify('Не удалось сохранить настройки: '+e.message)}}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('uk-UA',{maximumFractionDigits:2}).format(Number(n)||0)+' ₴'}
function dateKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function niceDate(v){try{return new Date(v+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}catch{return v}}
function notify(msg){const el=document.querySelector('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3600)}
function db(){if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB недоступна'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('mora-local-assets',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('assets'))req.result.createObjectStore('assets',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function putAsset(blob,name,kind){const d=await db();const id=uid();await new Promise((resolve,reject)=>{const tx=d.transaction('assets','readwrite');tx.objectStore('assets').put({id,blob,name,kind,createdAt:new Date().toISOString()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});return id}
async function getAsset(id){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('assets','readonly');const r=tx.objectStore('assets').get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function deleteAsset(id){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('assets','readwrite');tx.objectStore('assets').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function removeAssetIfUnused(id){const used=state.audioTracks.some(x=>x.assetId===id)||state.clips.some(x=>x.assetId===id)||state.media.some(x=>x.assetId===id);if(used)return;try{await deleteAsset(id)}catch{}if(objectUrls.has(id)){URL.revokeObjectURL(objectUrls.get(id));objectUrls.delete(id)}}
async function assetUrl(id){if(objectUrls.has(id))return objectUrls.get(id);const item=await getAsset(id);if(!item)return '';const url=URL.createObjectURL(item.blob);objectUrls.set(id,url);return url}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function appIcon(app){return `<span class="ico" style="--c1:${app.c1};--c2:${app.c2}"><svg viewBox="0 0 36 36" aria-hidden="true">${app.glyph}</svg></span>`}
function makeAppButton(app,named){const b=document.createElement('button');b.className='app';b.dataset.id=app.id;b.setAttribute('aria-label',app.name);b.innerHTML=appIcon(app)+(named?`<span class="app-name">${app.name}</span>`:'');b.addEventListener('click',()=>openApp(app.id));return b}
function initDesktop(){const grid=document.querySelector('#app-grid'),dock=document.querySelector('#dock');APPS.forEach(a=>grid.append(makeAppButton(a,true)));['po','kavun','unify','kabon'].forEach(id=>dock.append(makeAppButton(APPS.find(a=>a.id===id),false)));document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openApp(el.dataset.open)));document.querySelector('#window-close').addEventListener('click',closeApp);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApp();if(e.ctrlKey&&e.altKey&&!e.repeat){const shortcuts={k:'cockos',m:'kavun',b:'kabon',g:'gloverty',p:'po',i:'illidia',u:'unify'};if(shortcuts[e.key.toLowerCase()]){e.preventDefault();openApp(shortcuts[e.key.toLowerCase()])}}});document.querySelector('#window-body').addEventListener('click',handleClick);document.querySelector('#window-body').addEventListener('submit',handleSubmit);document.querySelector('#window-body').addEventListener('input',handleInput);document.querySelector('#window-body').addEventListener('change',handleChange);renderWidgets()}
function openApp(id){const app=APPS.find(a=>a.id===id);if(!app)return;currentApp=id;document.querySelector('#window-icon').innerHTML=appIcon(app);document.querySelector('#window-title').innerHTML=`${esc(app.name)}<small>${esc(app.sub)}</small>`;document.querySelector('#current-label').textContent=app.name;document.querySelector('#win').classList.add('open');document.querySelector('#win').style.left='50%';document.querySelector('#win').style.top='50%';document.querySelector('#win').style.transform='translate(-50%,-50%)';document.querySelectorAll('.dock .app').forEach(el=>el.classList.toggle('run',el.dataset.id===id));renderApp()}
function closeApp(){document.querySelector('#win').classList.remove('open');document.querySelector('#current-label').textContent='Домашний экран';document.querySelectorAll('.dock .app').forEach(el=>el.classList.remove('run'));currentApp=null}
function shellNote(text,type=''){return `<div class="note ${type}">${text}</div>`}
function empty(text){return `<div class="empty">${esc(text)}</div>`}
function btn(label,action,extra=''){return `<button type="button" class="btn ${extra}" data-action="${action}">${label}</button>`}
function renderApp(){if(!currentApp)return;const body=document.querySelector('#window-body');const views={cockos:renderCockos,kavun:renderKavun,kabon:renderKabon,gloverty:renderGloverty,po:renderPo,illidia:renderIllidia,unify:renderUnify};body.innerHTML=views[currentApp]();if(currentApp==='kavun')hydrateMedia();if(currentApp==='cockos')hydrateTracks()}
function renderCockos(){const tracks=state.audioTracks.map(t=>`<div class="list-row"><div class="list-main"><strong>${esc(t.name)}</strong><small>${esc(t.source)} · ${new Date(t.createdAt).toLocaleString('ru-RU')}</small></div><audio controls preload="none" data-audio-id="${esc(t.assetId)}" style="max-width:165px;width:34%"></audio><button class="btn" data-action="send-recording-kavun" data-id="${esc(t.id)}">Kavun</button><button class="btn" data-action="delete-track" data-id="${esc(t.id)}">×</button></div>`).join('');return `<div class="note warn">Браузерный прототип не управляет системными аудиосессиями других процессов. Ползунки ниже сохраняют настройки макета; для реального микшера нужна нативная аудиослужба DuckOS.</div><div class="section-title">Микшер приложений · настройки интерфейса</div>${['Po','Illidia','Unify','Kavun'].map((name)=>`<div class="list-row"><div class="list-main"><strong>${name}</strong><small>Сохранённый уровень приложения</small></div><input type="range" min="0" max="100" value="${state.volumePrefs[name]??70}" data-volume="${name}" aria-label="Уровень ${name}"><span class="small" data-volume-label="${name}">${state.volumePrefs[name]??70}%</span></div>`).join('')}<div class="section-title">Диктофон</div><div class="note">Запись использует микрофон браузера после вашего разрешения. Шумоподавление включается только если браузер/устройство поддерживает соответствующий аудиофлаг.</div><div class="list-row"><div class="list-main"><strong>Шумоподавление</strong><small>Передать noiseSuppression при запросе микрофона</small></div><input class="switch" type="checkbox" id="noise-suppression" checked></div><div class="actions">${activeRecording?btn('Остановить запись','stop-recording','danger'):btn('Начать запись','start-recording','primary')}</div><div class="section-title">Многодорожечная сессия</div><div class="field"><label for="audio-files">Добавить WAV/MP3/аудиофайлы</label><input id="audio-files" type="file" accept="audio/*" multiple></div><div class="actions">${btn('Добавить дорожки','import-audio')}${btn('Собрать микс и скачать WAV','mixdown','primary')}</div><div class="list">${tracks||empty('Пока нет дорожек. Запишите звук или добавьте аудиофайлы.')}</div>`}
async function importAudio(){const files=[...(document.querySelector('#audio-files')?.files||[])];if(!files.length)return notify('Выберите аудиофайлы');try{for(const file of files){if(file.size>80*1024*1024){notify(`${file.name}: превышен лимит 80 МБ`);continue}const assetId=await putAsset(file,file.name,'audio');state.audioTracks.push({id:uid(),assetId,name:file.name,source:'Файл',createdAt:new Date().toISOString()})}save();renderApp();notify('Аудиодорожки добавлены')}catch(err){notify('Не удалось добавить дорожки: '+err.message)}}
async function hydrateTracks(){for(const el of document.querySelectorAll('audio[data-audio-id]')){try{el.src=await assetUrl(el.dataset.audioId)}catch{}}}
function renderKavun(){const slices=state.slices.map(s=>`<span class="badge">${esc(s.name)}</span>`).join(' ');const media=state.media.map(m=>`<article class="media-card">${m.type&&m.type.startsWith('video/')?`<video data-media-video="${esc(m.id)}" controls muted style="width:100%;aspect-ratio:1;object-fit:cover"></video>`:m.type&&m.type.startsWith('audio/')?`<div style="padding:16px;background:#ffffff10">♫<audio data-audio-id="${esc(m.assetId)}" controls style="width:100%"></audio></div>`:`<img data-media-id="${esc(m.id)}" alt="${esc(m.name)}">`}<div class="media-caption"><strong>${esc(m.name)}</strong><br>${esc(m.event||'Без события')}<br><span class="small">${esc(m.place||'Место не задано')}</span><div class="actions"><button class="btn" data-action="assign-media" data-id="${esc(m.id)}">В дольку</button>${m.type&&m.type.startsWith('image/')?`<button class="btn" data-action="retouch-media" data-id="${esc(m.id)}">Ретушь</button>`:''}<button class="btn" data-action="delete-media" data-id="${esc(m.id)}">×</button></div></div></article>`).join('');const selected=state.media.find(m=>m.id===state.retouch.mediaId);return `<div class="note">«Дольки» — логические подборки. Оригинальные файлы не перемещаются; в этом прототипе медиа сохраняются локально в хранилище браузера.</div><div class="section-title">Добавить снимки или видео</div><div class="field"><label for="media-files">Файлы с устройства</label><input id="media-files" type="file" accept="image/*,video/*" multiple></div><div class="form-row"><div class="field"><label for="media-event">Событие / долька</label><input id="media-event" placeholder="Например, Лето у моря"></div><div class="field"><label for="media-place">Место</label><input id="media-place" placeholder="Город или место"></div></div><div class="actions">${btn('Добавить в галерею','import-media','primary')}${btn('Создать дольку','create-slice')}</div><div class="small">Дольки: ${slices||'пока не созданы'}</div><div class="section-title">Поиск по описаниям и событиям</div><div class="field"><input id="media-search" placeholder="Название, событие, место или заметка"></div><div class="section-title">Галерея</div><div class="media-grid">${media||empty('Галерея пуста. Добавьте изображения или видео с устройства.')}</div><div class="section-title">Быстрая ретушь</div>${selected?`<div class="panel"><strong>${esc(selected.name)}</strong><div class="field"><label>Яркость: ${state.retouch.brightness}%</label><input type="range" min="50" max="160" value="${state.retouch.brightness}" data-retouch="brightness"></div><div class="field"><label>Контраст: ${state.retouch.contrast}%</label><input type="range" min="50" max="160" value="${state.retouch.contrast}" data-retouch="contrast"></div><div class="field"><label>Насыщенность: ${state.retouch.saturate}%</label><input type="range" min="0" max="180" value="${state.retouch.saturate}" data-retouch="saturate"></div><div class="actions">${btn('Сбросить','reset-retouch')}${btn('Скачать копию','export-retouch')}</div></div>`:shellNote('Выберите изображение кнопкой «Ретушь» в карточке галереи. Правки обратимы и не меняют исходник.')} `}
async function hydrateMedia(){for(const el of document.querySelectorAll('[data-media-id],[data-media-video]')){const id=el.dataset.mediaId||el.dataset.mediaVideo;const m=state.media.find(x=>x.id===id);if(!m)continue;try{el.src=await assetUrl(m.assetId);if(el.tagName==='IMG'&&id===state.retouch.mediaId)el.style.filter=`brightness(${state.retouch.brightness}%) contrast(${state.retouch.contrast}%) saturate(${state.retouch.saturate}%)`}catch{}}for(const el of document.querySelectorAll('audio[data-audio-id]')){try{el.src=await assetUrl(el.dataset.audioId)}catch{}}}
function renderKabon(){const today=dateKey();const todays=state.expenses.filter(x=>x.date===today).reduce((n,x)=>n+Number(x.amount),0);const total=state.expenses.reduce((n,x)=>n+Number(x.amount),0);const cats={};state.expenses.forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));const max=Math.max(1,...Object.values(cats));const bars=Object.entries(cats).map(([k,v])=>`<div class="bar-line"><span>${esc(k)}</span><div class="bar-track"><i style="width:${v/max*100}%"></i></div><strong>${money(v)}</strong></div>`).join('');const exp=state.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="list-row"><div class="list-main"><strong>${esc(x.title)}</strong><small>${esc(x.category)} · ${niceDate(x.date)}</small></div><strong>${money(x.amount)}</strong><button class="btn" data-action="delete-expense" data-id="${esc(x.id)}">×</button></div>`).join('');const subs=state.subscriptions.map(x=>`<div class="list-row"><div class="list-main"><strong>${esc(x.name)}</strong><small>${money(x.amount)} · следующая дата ${niceDate(x.due)}</small></div><button class="btn" data-action="remind-sub" data-id="${esc(x.id)}">Напомнить</button><button class="btn" data-action="delete-sub" data-id="${esc(x.id)}">×</button></div>`).join('');return `<div class="card-grid"><div class="panel"><div class="muted">Расходы сегодня</div><div class="widget-value">${money(todays)}</div></div><div class="panel"><div class="muted">Все записи</div><div class="widget-value">${money(total)}</div></div></div><div class="section-title">Дневной лимит</div><div class="form-row"><div class="field"><label for="daily-limit">Лимит, ₴</label><input id="daily-limit" type="number" min="0" step="1" value="${state.dailyLimit||''}" placeholder="Задайте лимит"></div><div class="field" style="align-self:end"><button class="btn" data-action="save-limit">Сохранить лимит</button></div></div><div class="section-title">Добавить расход</div><form data-form="expense"><div class="form-row"><div class="field"><label>Что оплачено</label><input name="title" required maxlength="100" placeholder="Покупка или услуга"></div><div class="field"><label>Сумма, ₴</label><input name="amount" required type="number" min="0.01" step="0.01"></div></div><div class="form-row"><div class="field"><label>Категория</label><select name="category"><option>Еда</option><option>Транспорт</option><option>Дом</option><option>Здоровье</option><option>Подписки</option><option>Развлечения</option><option>Другое</option></select></div><div class="field"><label>Дата</label><input name="date" type="date" value="${today}" required></div></div><button class="btn primary" type="submit">Добавить расход</button></form><div class="section-title">Прикрепить чек</div><div class="field"><input id="receipt-file" type="file" accept="image/*" capture="environment"></div><div class="note">Фото чека можно сохранить как вложение, но OCR ещё не подключён: распознанные позиции не придумываются. Внесите итог и категории вручную.</div><div class="actions">${btn('Сохранить фото чека','save-receipt')}</div><div class="section-title">Расходы по категориям</div><div class="bar-list">${bars||empty('Категории появятся после добавления расходов.')}</div><div class="section-title">История</div><div class="list">${exp||empty('Записей пока нет.')}</div><div class="section-title">Подписки и автоплатежи</div><form data-form="subscription"><div class="form-row"><div class="field"><label>Название</label><input name="name" required placeholder="Например, облако"></div><div class="field"><label>Сумма, ₴</label><input name="amount" required type="number" min="0" step="0.01"></div></div><div class="form-row"><div class="field"><label>Следующая дата</label><input name="due" type="date" required value="${today}"></div><div class="field" style="align-self:end"><button class="btn primary" type="submit">Добавить подписку</button></div></div></form><div class="list">${subs||empty('Подписки пока не добавлены.')}</div><div class="section-title">Семейный бюджет · локальный список</div><form data-form="member"><div class="form-row"><div class="field"><label>Участник</label><input name="name" required placeholder="Имя участника"></div><div class="field"><label>Вклад, ₴</label><input name="amount" type="number" min="0" step="0.01" required></div></div><button type="submit" class="btn">Добавить участника</button></form><div class="list">${state.familyMembers.map(x=>`<div class="list-row"><div class="list-main"><strong>${esc(x.name)}</strong><small>Локально учтённый вклад</small></div><strong>${money(x.amount)}</strong></div>`).join('')||empty('Семейные участники не добавлены. Общий сетевой доступ не подключён.')}</div>`}
function renderGloverty(){const rules=state.rules.map(r=>`<div class="list-row"><div class="list-main"><strong>${esc(r.name)}</strong><small>${esc(ruleDescription(r))}</small><small>Действие: ${esc(r.actionLabel)}</small></div><input class="switch" type="checkbox" data-rule-toggle="${esc(r.id)}" ${r.enabled?'checked':''} aria-label="Включить ${esc(r.name)}"><button class="btn" data-action="run-rule" data-id="${esc(r.id)}">Выполнить</button></div>`).join('');return `<div class="note warn">Правила хранятся локально. Автоматический запуск по системным событиям, глобальные жесты тачпада и системные горячие клавиши требуют службы автоматизации DuckOS. Кнопка «Выполнить» запускает поддерживаемое действие прямо в прототипе.</div><div class="section-title">Новое правило</div><form data-form="rule"><div class="field"><label>Название</label><input name="name" maxlength="80" required placeholder="Еженедельный отчёт"></div><div class="form-row"><div class="field"><label>Триггер</label><select name="trigger"><option value="manual">Запуск вручную</option><option value="weekly">Каждое воскресенье, 20:00</option><option value="game">Начало игровой сессии</option></select></div><div class="field"><label>Действие</label><select name="action"><option value="weekly-report">Подготовить отчёт Ka-bon</option><option value="recording-kavun">Добавить последнюю запись Cockos в Kavun</option><option value="dnd-on">Включить режим «не беспокоить»</option><option value="dnd-off">Выключить режим «не беспокоить»</option><option value="tabs-transfer">Подготовить вкладки Po для Unify</option><option value="clips-transfer">Подготовить клипы Illidia для Unify</option></select></div></div><button class="btn primary" type="submit">Создать правило</button></form><div class="section-title">Ваши сценарии</div><div class="list">${rules||empty('Сценариев пока нет. Создайте правило выше.')}</div><div class="section-title">Жесты и горячие клавиши</div><div class="panel"><strong>Локальные сочетания прототипа</strong><p class="muted">Ctrl + Alt + K/Cockos · M/Kavun · B/Ka-bon · G/Gloverty · P/Po · I/Illidia · U/Unify. Они работают только пока эта страница активна.</p><p class="muted">Настройка реальных жестов сенсорной панели и глобальных сочетаний появится через системный input-service.</p></div>`}
function ruleDescription(r){return ({manual:'Запуск по кнопке',weekly:'Расписание: воскресенье, 20:00 (пока не планируется службой ОС)',game:'Событие игры (пока запускается вручную)'})[r.trigger]||r.trigger}
function renderPo(){const tabs=state.tabs.map(t=>`<div class="tab-row"><div class="list-main"><strong>${esc(t.title||t.url)}</strong><small>${esc(t.url)}</small></div>${btn('Открыть','open-tab') .replace('data-action="open-tab"',`data-action="open-tab" data-id="${esc(t.id)}"`)}<button class="btn" data-action="send-tab" data-id="${esc(t.id)}">Unify</button><button class="btn" data-action="delete-tab" data-id="${esc(t.id)}">×</button></div>`).join('');return `<div class="note warn">Это браузерный прототип: ссылки открываются в отдельной вкладке существующего браузера. Реальная изоляция вкладок, сетевой стек, фильтрация запросов трекеров и управление загрузками требуют системного браузерного движка DuckOS.</div><form data-form="tab"><div class="field"><label>Адрес или команда</label><input name="url" required placeholder="https://example.com или /open kavun"></div><div class="actions"><button class="btn primary" type="submit">Добавить вкладку</button><button class="btn" type="button" data-action="po-command">Выполнить команду</button></div></form><div class="section-title">Вертикальные вкладки</div><div class="list">${tabs||empty('Открытых вкладок нет. Добавьте адрес выше.')}</div><div class="section-title">Защита и чтение</div><div class="list-row"><div class="list-main"><strong>Защита от трекеров</strong><small>Настройка намерения; сетевой фильтр в прототипе не действует</small></div><input type="checkbox" class="switch" id="tracker-toggle" ${state.trackerProtection?'checked':''}></div><div class="section-title">Режим чтения · локальная заметка</div><form data-form="reader"><div class="field"><label>Заголовок</label><input name="title" placeholder="Заголовок материала"></div><div class="field"><label>Текст (вставьте текст страницы)</label><textarea name="text" placeholder="Текст для спокойного чтения…">${esc(state.readerText)}</textarea></div><button class="btn primary" type="submit">Открыть режим чтения</button></form><div id="reader-preview"></div>`}
function renderIllidia(){const games=state.games.map(g=>`<div class="list-row"><div class="list-main"><strong>${esc(g.name)}</strong><small>${g.progress||0}% · ${esc(g.url||'локальная запись библиотеки')} · достижений: ${(g.achievements||[]).length}</small></div><button class="btn" data-action="add-achievement" data-id="${esc(g.id)}">+ достижение</button><button class="btn" data-action="launch-game" data-id="${esc(g.id)}">Открыть</button><button class="btn" data-action="game-progress" data-id="${esc(g.id)}">+10%</button><button class="btn" data-action="delete-game" data-id="${esc(g.id)}">×</button></div>`).join('');const clips=state.clips.map(c=>`<div class="list-row"><div class="list-main"><strong>${esc(c.name)}</strong><small>${new Date(c.createdAt).toLocaleString('ru-RU')} · ${Math.round(c.size/1024)} КБ</small></div><button class="btn" data-action="download-clip" data-id="${esc(c.id)}">Скачать</button><button class="btn" data-action="send-clip" data-id="${esc(c.id)}">Unify</button></div>`).join('');return `<div class="note warn">Игры можно каталогизировать и открывать по URL. Запуск установленных EXE, облачные сохранения и достижения игровых платформ требуют нативных адаптеров и авторизации; они не имитируются этой страницей.</div><div class="section-title">Добавить игру в библиотеку</div><form data-form="game"><div class="form-row"><div class="field"><label>Название игры</label><input name="name" required placeholder="Название"></div><div class="field"><label>Ссылка (необязательно)</label><input name="url" placeholder="https://store.example/game"></div></div><button class="btn primary" type="submit">Добавить в библиотеку</button></form><div class="section-title">Моя библиотека</div><div class="list">${games||empty('Библиотека пуста. Добавьте игру.')}</div><div class="section-title">Игровая сессия</div><div class="list-row"><div class="list-main"><strong>Не беспокоить</strong><small>Локальный переключатель прототипа, не управляет системными уведомлениями</small></div><input class="switch" type="checkbox" id="dnd-toggle" ${state.doNotDisturb?'checked':''}></div><div class="section-title">Запись клипа с экрана</div><div class="note">Запись экрана доступна только в поддерживаемом браузере и после выбора области/окна пользователем. Клип сохраняется в локальном хранилище.</div><div class="actions">${activeScreenCapture?btn('Остановить запись клипа','stop-clip','danger'):btn('Записать экран','start-clip','primary')}</div><div class="section-title">Мои клипы</div><div class="list">${clips||empty('Клипов пока нет.')}</div>`}
function renderUnify(){const devices=state.devices.map(d=>`<div class="list-row"><div class="list-main"><strong>${esc(d.name)}</strong><small>Локальная метка · добавлено ${niceDate(d.date)}</small></div><span class="badge">не в сети</span><button class="btn" data-action="delete-device" data-id="${esc(d.id)}">×</button></div>`).join('');return `<div class="note warn">В этой HTML-сборке нет сетевого сервиса паринга и push-уведомлений. Устройства ниже — локальные метки. Обмен между экземплярами выполняется вручную через экспорт и импорт пакета; реальный межустройственный буфер, уведомления и поиск устройства потребуют защищённого Unify-сервиса DuckOS.</div><div class="section-title">Устройства</div><form data-form="device"><div class="form-row"><div class="field"><label>Название устройства</label><input name="name" required placeholder="Мой телефон"></div><div class="field" style="align-self:end"><button class="btn primary" type="submit">Добавить локальную метку</button></div></div></form><div class="list">${devices||empty('Устройства не добавлены.')}</div><div class="section-title">Общий буфер · это устройство</div><div class="field"><label>Текст буфера</label><textarea id="clipboard-value" placeholder="Текст для копирования…">${esc(state.clipboardText)}</textarea></div><div class="actions">${btn('Скопировать','clipboard-write')}${btn('Прочитать буфер','clipboard-read')}</div><div class="section-title">Настройки Mora</div><div class="list-row"><div class="list-main"><strong>Уменьшить анимацию</strong><small>Настройка этого прототипа</small></div><input class="switch" type="checkbox" id="reduce-motion" ${state.reduceMotion?'checked':''}></div><div class="section-title">Передача данных вручную</div><p class="muted">Выберите вкладки Po и игровые клипы Illidia, чтобы собрать переносимый JSON-пакет. Для переноса на другое устройство передайте файл и импортируйте его в Unify.</p><div class="list-row"><div class="list-main"><strong>Вкладки Po</strong><small>${state.tabs.length} записей</small></div><input class="switch" type="checkbox" id="export-tabs" checked></div><div class="list-row"><div class="list-main"><strong>Клипы Illidia</strong><small>${state.clips.length} записей; вложения включаются по размеру до 12 МБ каждое</small></div><input class="switch" type="checkbox" id="export-clips"></div><div class="actions">${btn('Экспортировать пакет','export-package','primary')}</div><div class="field"><label for="import-package">Импортировать пакет Unify (.json)</label><input id="import-package" type="file" accept="application/json,.json"></div><div class="actions">${btn('Импортировать выбранный файл','import-package')}</div><div class="section-title">Службы, требующие системной интеграции</div><div class="card-grid"><div class="panel"><strong>Уведомления телефона</strong><p class="muted">Не подключены</p></div><div class="panel"><strong>Поиск потерянного устройства</strong><p class="muted">Не подключён</p></div></div>`}
function renderWidgets(){const total=state.expenses.filter(x=>x.date===dateKey()).reduce((n,x)=>n+Number(x.amount),0);document.querySelector('#today-total').textContent=money(total);document.querySelector('#today-sub').textContent=state.dailyLimit?`${Math.min(100,total/state.dailyLimit*100).toFixed(0)}% дневного лимита`:'Добавьте расходы и задайте лимит';document.querySelector('#today-meter').style.width=(state.dailyLimit?Math.min(100,total/state.dailyLimit*100):0)+'%';document.querySelector('#device-count').textContent=state.devices.length;document.querySelector('#device-sub').textContent=state.devices.length?'Локально сохранённые метки устройств':'Устройства ещё не добавлены';document.querySelector('#device-chips').innerHTML=state.devices.slice(0,3).map(d=>`<span>${esc(d.name)}</span>`).join('')||'<span>Связь не подключена</span>'}
function handleInput(e){if(e.target.id==='media-search'){filterMedia(e.target.value);return}if(e.target.matches('[data-retouch]')){state.retouch[e.target.dataset.retouch]=Number(e.target.value);save();const panel=e.target.closest('.panel');if(panel){const label=e.target.previousElementSibling;if(label)label.textContent=label.textContent.split(':')[0]+': '+e.target.value+'%'}const img=document.querySelector(`img[data-media-id="${CSS.escape(state.retouch.mediaId)}"]`);if(img)img.style.filter=`brightness(${state.retouch.brightness}%) contrast(${state.retouch.contrast}%) saturate(${state.retouch.saturate}%)`;return}if(e.target.matches('[data-volume]')){const key=e.target.dataset.volume;state.volumePrefs[key]=Number(e.target.value);const lab=document.querySelector(`[data-volume-label="${CSS.escape(key)}"]`);if(lab)lab.textContent=e.target.value+'%';save()}}
function handleChange(e){const t=e.target;if(t.matches('[data-rule-toggle]')){const r=state.rules.find(x=>x.id===t.dataset.ruleToggle);if(r){r.enabled=t.checked;save()}}if(t.id==='tracker-toggle'){state.trackerProtection=t.checked;save();notify('Настройка сохранена. Сетевой фильтр требует браузерной службы DuckOS.')}if(t.id==='dnd-toggle'){state.doNotDisturb=t.checked;save();notify(t.checked?'Локальный режим фокуса включён':'Локальный режим фокуса выключен')}if(t.id==='reduce-motion'){state.reduceMotion=t.checked;document.documentElement.style.setProperty('--motion-off',t.checked?'1':'0');document.body.classList.toggle('reduce-motion',t.checked);save();notify('Настройка анимации сохранена для этого браузера')}if(t.id==='media-search')filterMedia(t.value)}
function handleSubmit(e){const f=e.target;if(!f.matches('form[data-form]'))return;e.preventDefault();const data=Object.fromEntries(new FormData(f).entries());switch(f.dataset.form){case'expense':{const amount=Number(data.amount);if(!(amount>0))return notify('Введите сумму больше нуля');state.expenses.push({id:uid(),title:data.title.trim(),amount,category:data.category,date:data.date});save();renderApp();notify('Расход добавлен локально');break}case'subscription':state.subscriptions.push({id:uid(),name:data.name.trim(),amount:Number(data.amount),due:data.due});save();renderApp();notify('Подписка добавлена');break;case'member':state.familyMembers.push({id:uid(),name:data.name.trim(),amount:Number(data.amount)});save();renderApp();break;case'rule':state.rules.push({id:uid(),name:data.name.trim(),trigger:data.trigger,action:data.action,actionLabel:({'weekly-report':'Подготовить отчёт Ka-bon','recording-kavun':'Передать последнюю запись Cockos в Kavun','dnd-on':'Включить режим «не беспокоить»','dnd-off':'Выключить режим «не беспокоить»','tabs-transfer':'Подготовить вкладки Po для Unify','clips-transfer':'Подготовить клипы Illidia для Unify'})[data.action],enabled:false});save();renderApp();break;case'tab':addTab(data.url);f.reset();break;case'reader':state.readerText=data.text;save();const out=document.querySelector('#reader-preview');out.innerHTML=`<article class="reader"><h2>${esc(data.title||'Режим чтения')}</h2><p>${esc(data.text)}</p></article>`;break;case'game':state.games.push({id:uid(),name:data.name.trim(),url:data.url.trim(),progress:0});save();renderApp();break;case'device':state.devices.push({id:uid(),name:data.name.trim(),date:dateKey()});save();renderApp();notify('Локальная метка добавлена. Сопряжение устройств ещё не установлено.');break}}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case'start-recording':startRecording();break;case'stop-recording':stopRecording();break;case'mixdown':mixdown();break;case'import-audio':importAudio();break;case'delete-track':deleteTrack(id);break;case'import-media':importMedia();break;case'create-slice':createSlice();break;case'delete-media':deleteMedia(id);break;case'assign-media':assignMediaToSlice(id);break;case'retouch-media':selectRetouch(id);break;case'reset-retouch':resetRetouch();break;case'export-retouch':exportRetouched();break;case'send-recording-kavun':sendRecordingToKavun(id);break;case'save-limit':saveLimit();break;case'save-receipt':saveReceipt();break;case'delete-expense':state.expenses=state.expenses.filter(x=>x.id!==id);save();renderApp();break;case'delete-sub':state.subscriptions=state.subscriptions.filter(x=>x.id!==id);save();renderApp();break;case'remind-sub':remindSubscription(id);break;case'run-rule':runRule(id);break;case'po-command':runPoCommand();break;case'open-tab':openTab(id);break;case'send-tab':sendTab(id);break;case'delete-tab':state.tabs=state.tabs.filter(x=>x.id!==id);save();renderApp();break;case'launch-game':launchGame(id);break;case'add-achievement':addAchievement(id);break;case'game-progress':{const g=state.games.find(x=>x.id===id);if(g){g.progress=Math.min(100,(g.progress||0)+10);save();renderApp()}break}case'delete-game':state.games=state.games.filter(x=>x.id!==id);save();renderApp();break;case'start-clip':startClip();break;case'stop-clip':stopClip();break;case'download-clip':downloadClip(id);break;case'send-clip':sendClip(id);break;case'delete-device':state.devices=state.devices.filter(x=>x.id!==id);save();renderApp();break;case'clipboard-write':writeClipboard();break;case'clipboard-read':readClipboard();break;case'export-package':exportPackage();break;case'import-package':importPackage();break}}
function addTab(raw){let url=raw.trim();if(url.startsWith('/open ')){const app=url.slice(6).trim().toLowerCase();if(APPS.some(a=>a.id===app||a.name.toLowerCase()===app)){openApp(APPS.find(a=>a.id===app||a.name.toLowerCase()===app).id);return}notify('Команда не распознана');return}if(!/^https?:\/\//i.test(url))url='https://'+url;try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw new Error();state.tabs.unshift({id:uid(),url:u.href,title:u.hostname,createdAt:new Date().toISOString()});save();renderApp()}catch{notify('Введите корректный HTTP(S)-адрес')}}
function openTab(id){const t=state.tabs.find(x=>x.id===id);if(t)window.open(t.url,'_blank','noopener,noreferrer')}
function sendTab(id){const t=state.tabs.find(x=>x.id===id);if(!t)return;const pack={schema:'unify.transfer.v1',createdAt:new Date().toISOString(),tabs:[t],clips:[]};downloadBlob(new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),'unify-tabs.json');notify('Файл передачи вкладки сохранён. Импортируйте его в Unify на другом устройстве.')}
function runPoCommand(){const input=document.querySelector('#window-body input[name="url"]');if(input)addTab(input.value)}
function filterMedia(q){document.querySelectorAll('.media-card').forEach(el=>{const m=state.media.find(x=>x.id===el.querySelector('[data-media-id]')?.dataset.mediaId);if(m)el.hidden=!`${m.name} ${m.event} ${m.place} ${m.note||''}`.toLowerCase().includes(q.toLowerCase())})}
async function importMedia(){const input=document.querySelector('#media-files');const files=[...(input?.files||[])];if(!files.length)return notify('Сначала выберите фото или видео');const eventName=document.querySelector('#media-event').value.trim();const place=document.querySelector('#media-place').value.trim();try{for(const file of files){if(file.size>40*1024*1024){notify(`${file.name}: превышен лимит 40 МБ`);continue}const assetId=await putAsset(file,file.name,'media');state.media.unshift({id:uid(),assetId,name:file.name,event:eventName,place,createdAt:new Date().toISOString(),type:file.type})}save();renderApp();notify('Файлы добавлены в локальную галерею')}catch(err){notify('Ошибка сохранения медиа: '+err.message)}}
function createSlice(){const name=prompt('Название новой дольки / события');if(!name?.trim())return;state.slices.push({id:uid(),name:name.trim(),createdAt:new Date().toISOString()});save();notify('Долька создана')}
async function deleteMedia(id){const m=state.media.find(x=>x.id===id);if(!m)return;state.media=state.media.filter(x=>x.id!==id);await removeAssetIfUnused(m.assetId);save();renderApp()}
function saveLimit(){const v=Number(document.querySelector('#daily-limit')?.value);if(v<0||!Number.isFinite(v))return notify('Некорректный лимит');state.dailyLimit=v;save();renderApp()}
async function saveReceipt(){const file=document.querySelector('#receipt-file')?.files?.[0];if(!file)return notify('Выберите фото чека');try{const assetId=await putAsset(file,file.name,'receipt');state.media.unshift({id:uid(),assetId,name:'Чек: '+file.name,event:'Чеки',place:'',createdAt:new Date().toISOString(),type:file.type});save();notify('Фото чека сохранено. Сумму и позиции внесите вручную.')}catch(err){notify('Не удалось сохранить чек: '+err.message)}}
function remindSubscription(id){const s=state.subscriptions.find(x=>x.id===id);if(!s)return;const text=`Напоминание: ${s.name}, ${money(s.amount)}, дата ${niceDate(s.due)}`;if('Notification'in window&&Notification.permission==='granted'){new Notification('Ka-bon',{body:text})}else notify(text+' · системное уведомление не разрешено')}
function runRule(id){const r=state.rules.find(x=>x.id===id);if(!r)return;if(!r.enabled)return notify('Сначала включите сценарий переключателем');switch(r.action){case'weekly-report':{const total=state.expenses.reduce((n,x)=>n+Number(x.amount),0);const summary=`Сводка Ka-bon: ${state.expenses.length} операций на сумму ${money(total)}. Подписок: ${state.subscriptions.length}.`;openApp('kabon');notify(summary);break}case'recording-kavun':{const last=state.audioTracks[0];if(!last)return notify('В Cockos ещё нет записи');state.media.unshift({id:uid(),assetId:last.assetId,name:last.name,event:'Запись Cockos',place:'',createdAt:new Date().toISOString(),type:'audio/webm'});save();openApp('kavun');notify('Запись Cockos добавлена в медиатеку Kavun');break}case'dnd-on':state.doNotDisturb=true;save();openApp('illidia');notify('Локальный режим фокуса включён');break;case'dnd-off':state.doNotDisturb=false;save();openApp('illidia');notify('Локальный режим фокуса выключен');break;case'tabs-transfer':openApp('unify');document.querySelector('#export-tabs')?.click();notify('Откройте экспорт пакета Unify');break;case'clips-transfer':openApp('unify');notify('В Unify выберите экспорт игровых клипов');break}}
function assignMediaToSlice(id){const m=state.media.find(x=>x.id===id);if(!m)return;const options=state.slices.map(x=>x.name);const choice=prompt('Название события / дольки',m.event||options[0]||'Новое событие');if(!choice?.trim())return;let slice=state.slices.find(x=>x.name.toLowerCase()===choice.trim().toLowerCase());if(!slice){slice={id:uid(),name:choice.trim(),createdAt:new Date().toISOString()};state.slices.push(slice)}m.event=slice.name;save();renderApp();notify('Файл добавлен в дольку «'+slice.name+'»')}
function selectRetouch(id){state.retouch={...state.retouch,mediaId:id};save();renderApp()}
async function exportRetouched(){const m=state.media.find(x=>x.id===state.retouch.mediaId);if(!m)return;try{const item=await getAsset(m.assetId);if(!item||!item.blob.type.startsWith('image/'))throw new Error('Выберите изображение');const url=URL.createObjectURL(item.blob);const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d');ctx.filter=`brightness(${state.retouch.brightness}%) contrast(${state.retouch.contrast}%) saturate(${state.retouch.saturate}%)`;ctx.drawImage(img,0,0);canvas.toBlob(blob=>{if(blob)downloadBlob(blob,'kavun-retouched.png');URL.revokeObjectURL(url)},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);notify('Не удалось прочитать изображение')};img.src=url}catch(err){notify('Экспорт не выполнен: '+err.message)}}
function resetRetouch(){state.retouch={mediaId:state.retouch.mediaId,brightness:100,contrast:100,saturate:100};save();renderApp()}
async function sendRecordingToKavun(id){const t=state.audioTracks.find(x=>x.id===id);if(!t)return;state.media.unshift({id:uid(),assetId:t.assetId,name:t.name,event:'Запись Cockos',place:'',createdAt:new Date().toISOString(),type:'audio/webm'});save();openApp('kavun');notify('Запись Cockos добавлена в медиатеку Kavun')}
function addAchievement(id){const g=state.games.find(x=>x.id===id);if(!g)return;const title=prompt('Название достижения');if(!title?.trim())return;g.achievements=g.achievements||[];g.achievements.push({id:uid(),title:title.trim(),date:dateKey()});save();renderApp();notify('Достижение добавлено в локальный профиль')}
function launchGame(id){const g=state.games.find(x=>x.id===id);if(!g)return;if(g.url){window.open(g.url,'_blank','noopener,noreferrer');return}notify('Запуск установленного EXE требует нативного Game Launcher DuckOS. Игра пока только в каталоге.')}
async function startRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return notify('Запись микрофона недоступна в этом браузере. Откройте страницу через HTTPS или localhost.');try{const noise=document.querySelector('#noise-suppression')?.checked??true;const stream=await navigator.mediaDevices.getUserMedia({audio:{noiseSuppression:noise,echoCancellation:true,autoGainControl:true}});const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x));const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());activeRecording=null;const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(blob.size){try{const name='Запись '+new Date().toLocaleString('ru-RU');const assetId=await putAsset(blob,name,'audio');state.audioTracks.unshift({id:uid(),assetId,name,source:'Микрофон',createdAt:new Date().toISOString()});save();notify('Запись сохранена в локальную медиатеку')}catch(err){notify('Не удалось сохранить запись: '+err.message)}}renderApp()};recorder.start();activeRecording={recorder,stream};renderApp();notify('Запись началась. Нажмите «Остановить запись», когда закончите.')}catch(err){notify('Микрофон недоступен: '+err.message)}}
function stopRecording(){if(activeRecording?.recorder?.state==='recording')activeRecording.recorder.stop()}
async function deleteTrack(id){const t=state.audioTracks.find(x=>x.id===id);if(!t)return;state.audioTracks=state.audioTracks.filter(x=>x.id!==id);await removeAssetIfUnused(t.assetId);save();renderApp()}
async function mixdown(){if(!state.audioTracks.length)return notify('Нет аудиодорожек для сведения');if(!window.AudioContext&&!window.webkitAudioContext)return notify('Web Audio API недоступен');try{const Ctx=window.AudioContext||window.webkitAudioContext;const ctx=new Ctx();const decoded=[];for(const t of state.audioTracks){const a=await getAsset(t.assetId);if(!a)continue;decoded.push(await ctx.decodeAudioData(await a.blob.arrayBuffer()))}if(!decoded.length)throw new Error('Не удалось прочитать дорожки');const rate=decoded[0].sampleRate;const length=Math.max(...decoded.map(x=>x.length));const off=new OfflineAudioContext(2,length,rate);decoded.forEach(buffer=>{const src=off.createBufferSource();src.buffer=buffer;const gain=off.createGain();gain.gain.value=1;src.connect(gain).connect(off.destination);src.start()});const mixed=await off.startRendering();const blob=encodeWav(mixed);downloadBlob(blob,'cockos-mix.wav');await ctx.close();notify('Стереомикс WAV создан локально')}catch(err){notify('Не удалось собрать микс: '+err.message)}}
function encodeWav(buffer){const channels=buffer.numberOfChannels,rate=buffer.sampleRate,frames=buffer.length,dataSize=frames*channels*2;const ab=new ArrayBuffer(44+dataSize),v=new DataView(ab);const write=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));write(0,'RIFF');v.setUint32(4,36+dataSize,true);write(8,'WAVE');write(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,rate,true);v.setUint32(28,rate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);write(36,'data');v.setUint32(40,dataSize,true);let p=44;for(let i=0;i<frames;i++)for(let c=0;c<channels;c++){let s=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
async function startClip(){if(!navigator.mediaDevices?.getDisplayMedia||!window.MediaRecorder)return notify('Захват экрана недоступен. Нужен поддерживаемый браузер и HTTPS/localhost.');try{const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});const mime=['video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());activeScreenCapture=null;const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});if(blob.size){try{const name='Клип '+new Date().toLocaleString('ru-RU');const assetId=await putAsset(blob,name,'clip');state.clips.unshift({id:uid(),assetId,name,size:blob.size,createdAt:new Date().toISOString()});save();notify('Клип сохранён локально')}catch(err){notify('Ошибка сохранения клипа: '+err.message)}}renderApp()};rec.start();activeScreenCapture={rec,stream};renderApp();notify('Захват начался. Остановите запись в Illidia.')}catch(err){notify('Захват экрана отменён или недоступен: '+err.message)}}
function stopClip(){if(activeScreenCapture?.rec?.state==='recording')activeScreenCapture.rec.stop()}
async function downloadClip(id){const c=state.clips.find(x=>x.id===id);if(!c)return;const a=await getAsset(c.assetId);if(a)downloadBlob(a.blob,c.name.replace(/[^\w\u0400-\u04ff -]/g,'_')+'.webm')}
async function sendClip(id){const c=state.clips.find(x=>x.id===id);if(!c)return;try{const item=await getAsset(c.assetId);if(!item)return;const data=await blobToDataURL(item.blob);const pack={schema:'unify.transfer.v1',createdAt:new Date().toISOString(),tabs:[],clips:[{name:c.name,mime:item.blob.type,dataUrl:data}]};downloadBlob(new Blob([JSON.stringify(pack)],{type:'application/json'}),'unify-game-clip.json');notify('Пакет клипа создан для ручной передачи')}catch(err){notify(err.message)}}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function writeClipboard(){const text=document.querySelector('#clipboard-value').value;state.clipboardText=text;save();try{await navigator.clipboard.writeText(text);notify('Текст скопирован в буфер этого браузера')}catch{notify('Текст сохранён в локальном поле. Clipboard API недоступен или не получил разрешение.')}}
async function readClipboard(){try{const text=await navigator.clipboard.readText();document.querySelector('#clipboard-value').value=text;state.clipboardText=text;save();notify('Буфер браузера прочитан')}catch(err){notify('Не удалось прочитать буфер: '+err.message)}}
async function exportPackage(){const pack={schema:'unify.transfer.v1',createdAt:new Date().toISOString(),tabs:document.querySelector('#export-tabs')?.checked?state.tabs:[],clips:[],settings:{reduceMotion:state.reduceMotion,doNotDisturb:state.doNotDisturb,trackerProtection:state.trackerProtection,volumePrefs:state.volumePrefs}};if(document.querySelector('#export-clips')?.checked){for(const c of state.clips){const item=await getAsset(c.assetId);if(item&&item.blob.size<=12*1024*1024){pack.clips.push({name:c.name,mime:item.blob.type,dataUrl:await blobToDataURL(item.blob)})}}}downloadBlob(new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),'unify-transfer.json');notify('Пакет передачи создан. Передайте файл и импортируйте его на другом устройстве.')}
async function importPackage(){const f=document.querySelector('#import-package')?.files?.[0];if(!f)return notify('Выберите JSON-файл');if(f.size>20*1024*1024)return notify('Пакет слишком большой (лимит 20 МБ)');try{const p=JSON.parse(await f.text());if(p.schema!=='unify.transfer.v1'||!Array.isArray(p.tabs)||!Array.isArray(p.clips))throw new Error('Неподдерживаемый формат');p.tabs.forEach(t=>{if(typeof t.url==='string'&&/^https?:\/\//i.test(t.url))state.tabs.push({id:uid(),url:t.url,title:String(t.title||new URL(t.url).hostname),createdAt:new Date().toISOString()})});if(p.settings&&typeof p.settings==='object'){state.reduceMotion=!!p.settings.reduceMotion;state.doNotDisturb=!!p.settings.doNotDisturb;state.trackerProtection=p.settings.trackerProtection!==false;state.volumePrefs={...state.volumePrefs,...(p.settings.volumePrefs||{})}}for(const c of p.clips){if(typeof c.dataUrl!=='string'||!c.dataUrl.startsWith('data:'))continue;const response=await fetch(c.dataUrl);const blob=await response.blob();if(blob.size>12*1024*1024)continue;const assetId=await putAsset(blob,String(c.name||'Импортированный клип'),'clip');state.clips.unshift({id:uid(),assetId,name:String(c.name||'Импортированный клип'),size:blob.size,createdAt:new Date().toISOString()})}save();renderApp();notify('Пакет импортирован в локальное хранилище')}catch(err){notify('Пакет не принят: '+err.message)}}
function runPoCommandFallback(){const v=document.querySelector('#window-body input[name="url"]')?.value||'';addTab(v)}
function addToastStatus(){const d=new Date();document.querySelector('#clock-time').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});document.querySelector('#clock-mini').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});document.querySelector('#clock-date').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}
const head=document.querySelector('#window-head');let drag=null;head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=document.querySelector('#win').getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};head.setPointerCapture(e.pointerId)});head.addEventListener('pointermove',e=>{if(!drag)return;const win=document.querySelector('#win');const x=Math.max(8,Math.min(innerWidth-win.offsetWidth-8,e.clientX-drag.x));const y=Math.max(8,Math.min(innerHeight-win.offsetHeight-8,e.clientY-drag.y));win.style.left=x+'px';win.style.top=y+'px';win.style.transform='none'});head.addEventListener('pointerup',()=>drag=null);head.addEventListener('pointercancel',()=>drag=null);
if(state.reduceMotion)document.body.classList.add('reduce-motion');initDesktop();addToastStatus();setInterval(addToastStatus,10000);
</script>
</body>
