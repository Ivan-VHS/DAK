[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dakos-build-tools"
version = "0.2.0"
description = "DAKOS image, driver ABI and Windows-compatibility inspection tools."
requires-python = ">=3.10"

[project.scripts]
dakos = "dakos.cli:main"

[tool.setuptools.packages.find]
include = ["dakos*"]

[tool.setuptools.package-data]
"dakos.gaming" = ["game-performance-rules.v1.json"]
