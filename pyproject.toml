[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duckos-build-tools"
version = "0.2.0"
description = "DuckOS image, driver ABI and Windows-compatibility inspection tools."
requires-python = ">=3.10"

[project.scripts]
duckos = "duckos.cli:main"

[tool.setuptools.packages.find]
include = ["duckos*"]
