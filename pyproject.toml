[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dak-build-tools"
version = "0.2.0"
description = "DAK image, driver ABI and Windows-compatibility inspection tools."
requires-python = ">=3.10"

[project.scripts]
dak = "dak.cli:main"

[tool.setuptools.packages.find]
include = ["dak*"]
