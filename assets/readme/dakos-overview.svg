<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">DAKOS — Reaper-first operating-system project</title>
<desc id="desc">A black and gold technical overview separating the experimental x86-64 Stage 1 boot path, Reaper reference policies, and the Mora host-browser desktop shell.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".55" stop-color="#10100D"/><stop offset="1" stop-color="#1B1708"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A97D00"/><stop offset=".48" stop-color="#FFD700"/><stop offset="1" stop-color="#FFF0A3"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#FFD700" stop-opacity=".18"/><stop offset="1" stop-color="#FFD700" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#FFF0A3" stroke-opacity=".065" stroke-width="1"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    .eyebrow{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.5px;fill:#FFD700}
    .brand{font:760 78px Inter,Segoe UI,Arial,sans-serif;letter-spacing:-3px;fill:#FFFDF4}
    .tag{font:650 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#E9DDAF}
    .body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#B8B09A}
    .tiny{font:600 9px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.25px;fill:#B9AD7C}
    .cardhead{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#FFF8D9}
    .cardbody{font:450 11px Inter,Segoe UI,Arial,sans-serif;fill:#B9B19C}
    .number{font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#FFD700}
  </style>
</defs>
<rect width="1440" height="520" rx="28" fill="url(#bg)"/>
<rect width="1440" height="520" rx="28" fill="url(#grid)"/>
<circle cx="410" cy="165" r="370" fill="url(#glow)"/>
<circle cx="1240" cy="300" r="340" fill="url(#glow)" opacity=".7"/>
<path d="M0 444C230 380 385 505 610 430S1060 385 1440 455" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity=".32"/>
<path d="M0 458C230 394 385 519 610 444S1060 399 1440 469" fill="none" stroke="url(#gold)" stroke-width="1" opacity=".15"/>
<rect x="58" y="70" width="4" height="310" rx="2" fill="url(#gold)"/>
<text x="88" y="108" class="eyebrow">REAPER-FIRST  /  LOCAL-FIRST  /  X86_64</text>
<text x="80" y="206" class="brand">DAKOS</text>
<text x="88" y="249" class="tag">OPERATING SYSTEM • ECOSYSTEM • MORA SHELL</text>
<text x="88" y="294" class="body">A transparent view of what runs today,</text>
<text x="88" y="315" class="body">what is validated in QEMU, and what remains planned.</text>
<rect x="88" y="350" width="210" height="34" rx="17" fill="#191506" stroke="#806400"/>
<circle cx="108" cy="367" r="4" fill="#FFD700"/>
<text x="123" y="371" class="tiny" fill="#FFF0A3">STAGE 1 BOOT VERIFIED IN QEMU</text>
<text x="88" y="448" class="eyebrow">ARCHITECTURE / 2026</text>
<text x="88" y="469" class="tiny">THREE CLEAR BOUNDARIES • NO MOCK KERNEL CLAIMS</text>
<g transform="translate(650 90)">
  <rect width="718" height="108" rx="20" fill="#15140F" stroke="#675313" stroke-width="1.2"/>
  <rect x="20" y="18" width="4" height="72" rx="2" fill="#FFD700"/>
  <text x="42" y="43" class="eyebrow">01 / BOOT PATH</text>
  <text x="42" y="70" class="cardhead">Limine → Boot Info v1 → early frame allocator</text>
  <text x="42" y="89" class="cardbody">BIOS + UEFI QEMU checks • serial marker • halt after Stage 1</text>
  <text x="682" y="42" class="number" text-anchor="end">VERIFIED</text>
</g>
<g transform="translate(650 218)">
  <rect width="718" height="108" rx="20" fill="#15140F" stroke="#675313" stroke-width="1.2"/>
  <rect x="20" y="18" width="4" height="72" rx="2" fill="#DDBB38"/>
  <text x="42" y="43" class="eyebrow">02 / POLICY LAYER</text>
  <text x="42" y="70" class="cardhead">Reaper reference contracts + deterministic tests</text>
  <text x="42" y="89" class="cardbody">Boot, memory, scheduling, IPC, capabilities and service policies</text>
  <text x="682" y="42" class="number" text-anchor="end">REFERENCE</text>
</g>
<g transform="translate(650 346)">
  <rect width="718" height="108" rx="20" fill="#15140F" stroke="#675313" stroke-width="1.2"/>
  <rect x="20" y="18" width="4" height="72" rx="2" fill="#B49A52"/>
  <text x="42" y="43" class="eyebrow">03 / HOST DESKTOP</text>
  <text x="42" y="70" class="cardhead">Mora local-first browser shell + project workbenches</text>
  <text x="42" y="89" class="cardbody">Runs separately on the host • not launched by the Stage 1 kernel</text>
  <text x="682" y="42" class="number" text-anchor="end">HOST APP</text>
</g>
<text x="1368" y="492" class="tiny" text-anchor="end">IVAN-VHS / DAKOS</text>
</svg>